services:
  enshrouded:
    container_name: enshrouded-server
    image: sknnr/enshrouded-dedicated-server:latest
    restart: unless-stopped
    # Skips the full check of the game files on every start. See ../azure/fast-start.sh
    entrypoint: ["/bin/bash", "/home/steam/fast-start.sh"]
    stop_grace_period: 2m
    environment:
      - EXTERNAL_CONFIG=1
    ports:
      - "15637:15637/udp"
      - "27015:27015/udp"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    # setup.sh creates these folders. create_host_path is off so a wrong
    # ENSHROUDED_DATA fails to start, rather than starting an empty world.
    volumes:
      - type: bind
        source: ${ENSHROUDED_DATA:-/srv/enshrouded}/install
        target: /home/steam/enshrouded
        bind:
          create_host_path: false
      - type: bind
        source: ${ENSHROUDED_DATA:-/srv/enshrouded}/savegame
        target: /home/steam/enshrouded/savegame
        bind:
          create_host_path: false
      - type: bind
        source: ../azure/fast-start.sh
        target: /home/steam/fast-start.sh
        read_only: true
        bind:
          create_host_path: false
      # Built by setup.sh from ../azure/enshrouded_server.json and secrets.env
      - type: bind
        source: ${ENSHROUDED_DATA:-/srv/enshrouded}/enshrouded_server.json
        target: /home/steam/enshrouded/enshrouded_server.json
        bind:
          create_host_path: false
