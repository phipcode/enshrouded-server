services:
  enshrouded:
    container_name: enshrouded-server
    image: sknnr/enshrouded-dedicated-server:latest
    restart: unless-stopped
    # Adds the passwords to the settings, then starts with ../azure/fast-start.sh,
    # which skips the full check of the game files on every start.
    entrypoint: ["/bin/bash", "/home/steam/home-start.sh"]
    stop_grace_period: 2m
    # SERVER_PASSWORD and ADMIN_PASSWORD. Copy secrets.env.example to start.
    env_file: secrets.env
    environment:
      - EXTERNAL_CONFIG=1
    ports:
      - "15637:15637/udp"
      - "27015:27015/udp"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    # The data folders must exist and be owned by 10000:10000 (see README.md).
    # create_host_path is off so a missing folder stops the start, rather than
    # creating a root-owned folder and an empty world.
    volumes:
      - type: bind
        source: ${ENSHROUDED_DATA:-/srv/enshrouded}/install
        target: /home/steam/enshrouded
        bind:
          create_host_path: false
      - type: bind
        source: ${ENSHROUDED_DATA:-/srv/enshrouded}/savegame
        target: /home/steam/enshrouded/savegame
        bind:
          create_host_path: false
      - type: bind
        source: ./start.sh
        target: /home/steam/home-start.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../azure/fast-start.sh
        target: /home/steam/fast-start.sh
        read_only: true
        bind:
          create_host_path: false
      # The same server settings as Azure, without the passwords
      - type: bind
        source: ../azure/enshrouded_server.json
        target: /home/steam/enshrouded_server.template.json
        read_only: true
        bind:
          create_host_path: false
